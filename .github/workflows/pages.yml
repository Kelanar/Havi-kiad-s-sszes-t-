name: Deploy static app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create public Supabase configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          url = os.environ.get("SUPABASE_URL", "").strip()
          key = os.environ.get("SUPABASE_ANON_KEY", "").strip()
          if bool(url) != bool(key):
              raise SystemExit("Set both SUPABASE_URL and SUPABASE_ANON_KEY, or leave both empty.")
          config = {
              "supabaseUrl": url,
              "supabaseAnonKey": key,
          }
          Path("supabase-config.js").write_text(
              "window.APP_CONFIG = " + json.dumps(config) + ";\n",
              encoding="utf-8",
          )
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir dist
          cp index.html styles.css app.js favicon.svg .nojekyll supabase-config.js dist/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
